# ==============================================================================
# NGINX CONFIGURATION FOR VIETNAMESE VOICEBOT (HTTPS & WSS PRODUCTION REVERSE PROXY)
# ==============================================================================
# Đường dẫn cài đặt đề xuất trên Ubuntu VPS: /etc/nginx/sites-available/voicebot
# Kích hoạt bằng lệnh: sudo ln -s /etc/nginx/sites-available/voicebot /etc/nginx/sites-enabled/
# ==============================================================================

# 1. Chuyển hướng tự động toàn bộ HTTP sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name voicebot.yourdomain.com; # Thay bằng tên miền thực tế của bạn

    # Cho phép Certbot xác thực SSL qua HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Máy chủ HTTPS & WebSocket bảo mật WSS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name voicebot.yourdomain.com; # Thay bằng tên miền thực tế của bạn

    # Đường dẫn chứng chỉ SSL Let's Encrypt (sẽ do Certbot tự sinh)
    ssl_certificate /etc/letsencrypt/live/voicebot.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voicebot.yourdomain.com/privkey.pem;

    # Cấu hình SSL tối ưu bảo mật
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip nén các tệp tĩnh (CSS/JS/HTML) tăng tốc độ tải trang
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Cấu hình Web Static & API REST
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bộ đệm proxy
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }

    # BẮT BUỘC: ĐỊNH TUYẾN WEBSOCKET SONG CÔNG FULL-DUPLEX (/ws/audio)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;

        # Nâng cấp kết nối HTTP lên WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tắt bộ đệm để truyền streaming audio mượt mà không bị trễ
        proxy_buffering off;

        # Thời gian chờ kết nối WebSocket (1 giờ để không bị ngắt giữa chừng)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
